<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Radio Pop en Español</title>
<meta name="description" content="Radio Pop en Español, las 24 horas.">
<meta name="theme-color" content="#ffffff">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,800&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<style>
  /* ====== CAMBIÁ ACÁ LOS COLORES ====== */
  :root {
    --fondo: #ffffff;
    --tarjeta: #ffffff;
    --texto: #0f172a;
    --suave: #526077;
    --acento: #2563eb;
    --acento-2: #06b6d4;
    --borde: #e2e8f0;
    --error: #b42318;
  }
  * { box-sizing: border-box; margin: 0; }
  body {
    min-height: 100vh;
    background:
      radial-gradient(60rem 40rem at 85% -10%, #2563eb14, transparent 60%),
      radial-gradient(50rem 35rem at -10% 110%, #06b6d414, transparent 60%),
      var(--fondo);
    color: var(--texto);
    font-family: "Inter", system-ui, sans-serif;
    display: flex; flex-direction: column; align-items: center;
    padding: 2rem 1rem 3rem;
  }
  header { width: 100%; max-width: 30rem; margin-bottom: 1.5rem; }
  .marca {
    font-family: "Bricolage Grotesque", sans-serif; font-weight: 800;
    font-size: clamp(2.6rem, 11vw, 3.6rem); line-height: .95; letter-spacing: -.03em;
  }
  .marca span { color: var(--acento); }
  .sub-marca { font-size: .45em; letter-spacing: .02em; }
  .lema { color: var(--suave); margin-top: .5rem; }

  .reproductor {
    width: 100%; max-width: 30rem;
    background: var(--tarjeta); border: 1px solid var(--borde);
    border-radius: 1.5rem; padding: 1.5rem;
    box-shadow: 0 1.25rem 2.5rem #0f172a14;
  }
  .estado {
    display: inline-flex; align-items: center; gap: .45rem;
    font-size: .8rem; font-weight: 500; letter-spacing: .08em; text-transform: uppercase;
    color: var(--suave);
  }
  .cabecera { display: flex; justify-content: space-between; align-items: center; gap: .5rem; }
  .etiquetas { display: flex; gap: .35rem; flex-wrap: wrap; justify-content: flex-end; }
  .calidad[hidden] { display: none; }
  .calidad {
    font-size: .75rem; font-weight: 500; color: var(--suave);
    border: 1px solid var(--borde); border-radius: 1rem; padding: .2rem .6rem;
    white-space: nowrap;
  }
  .punto { width: .55rem; height: .55rem; border-radius: 50%; background: var(--suave); }
  .sonando .punto { background: var(--acento); animation: latido 1.4s ease-in-out infinite; }
  .sonando .estado { color: var(--acento); }
  .apagada .punto { background: #94a3b8; animation: none; }
  .apagada .estado { color: #64748b; }
  @keyframes latido { 50% { opacity: .3; transform: scale(.8); } }

  .tema { display: flex; gap: 1rem; align-items: center; margin: 1.25rem 0 1.5rem; }
  .tapa {
    width: 5.5rem; height: 5.5rem; flex: none; border-radius: 1rem; overflow: hidden;
    background: linear-gradient(135deg, var(--acento), var(--acento-2));
    display: grid; place-items: center;
  }
  .tapa img { width: 100%; height: 100%; object-fit: cover; display: none; }
  .tapa svg { width: 2.4rem; height: 2.4rem; fill: #ffffffd9; }
  .titulo {
    font-family: "Bricolage Grotesque", sans-serif; font-weight: 500;
    font-size: 1.3rem; line-height: 1.2;
  }
  .artista { color: var(--suave); margin-top: .25rem; }
  .titulo, .artista { overflow-wrap: anywhere; }

  .progreso { margin: -.25rem 0 1.5rem; }
  .barra {
    height: .4rem; border-radius: 1rem; background: var(--borde); overflow: hidden; position: relative;
  }
  .relleno {
    position: absolute; inset: 0 auto 0 0; width: 0%;
    background: linear-gradient(90deg, var(--acento), var(--acento-2));
    border-radius: inherit; transition: width .9s linear;
  }
  .barra.incierta .relleno { width: 0%; transition: none; }
  .progreso[hidden] { display: none; }
  .tiempos {
    display: flex; justify-content: space-between; margin-top: .4rem;
    font-size: .8rem; color: var(--suave); font-variant-numeric: tabular-nums;
  }
  .controles { display: flex; align-items: center; gap: 1rem; }
  .play {
    width: 4.25rem; height: 4.25rem; flex: none; border: 0; border-radius: 50%;
    background: var(--acento); color: #fff; cursor: pointer;
    display: grid; place-items: center;
    transition: transform .15s ease, box-shadow .15s ease;
    box-shadow: 0 .6rem 1.5rem #2563eb4d;
  }
  .play:hover { transform: scale(1.05); }
  .play:active { transform: scale(.96); }
  .play:focus-visible { outline: 3px solid var(--acento-2); outline-offset: 3px; }
  .play svg { width: 1.7rem; height: 1.7rem; fill: currentColor; }
  .play.cargando svg { display: none; }
  .play.cargando::after {
    content: ""; width: 1.6rem; height: 1.6rem; border-radius: 50%;
    border: 3px solid #ffffff59; border-top-color: #fff; animation: girar .8s linear infinite;
  }
  @keyframes girar { to { transform: rotate(360deg); } }
  @media (prefers-reduced-motion: reduce) {
    .play.cargando::after, .sonando .punto { animation-duration: 3s; }
  }
  .volumen { margin-left: auto; display: flex; align-items: center; gap: .4rem; color: var(--suave); }
  .silencio {
    width: 2.4rem; height: 2.4rem; border: 0; border-radius: 50%; background: transparent;
    color: var(--suave); cursor: pointer; display: grid; place-items: center;
  }
  .silencio:hover { background: var(--borde); }
  .silencio:focus-visible { outline: 2px solid var(--acento); }
  .silencio svg { width: 1.3rem; height: 1.3rem; fill: currentColor; }
  input[type=range] { width: 7rem; accent-color: var(--acento); }
  .es-ios input[type=range] { display: none; }   /* iPhone no deja cambiar el volumen desde la web */

  .aviso { min-height: 1.2rem; margin-top: 1rem; font-size: .85rem; color: var(--suave); }
  .aviso.error { color: var(--error); }
  .aviso.error::before { content: "⚠ "; }

  .historial { width: 100%; max-width: 30rem; margin-top: 2rem; }
  .historial h2 {
    font-size: .8rem; font-weight: 500; letter-spacing: .08em; text-transform: uppercase;
    color: var(--suave); margin-bottom: .75rem;
  }
  .historial ol { list-style: none; padding: 0; }
  .historial li {
    padding: .7rem 0; border-bottom: 1px solid var(--borde);
    display: flex; gap: .75rem; align-items: baseline;
  }
  .historial li b { font-weight: 500; }
  .historial li small { color: var(--suave); }
  .historial .vacio { color: var(--suave); border: 0; }

  footer {
    width: 100%; max-width: 30rem; margin-top: 2.5rem;
    font-size: .8rem; line-height: 1.5; color: var(--suave);
  }
  footer a { color: var(--texto); }
</style>
</head>
<body>

<header>
  <!-- ====== CAMBIÁ ACÁ EL NOMBRE Y EL LEMA ====== -->
  <h1 class="marca">Radio<br><span>Pop</span><br><small class="sub-marca">en Español</small></h1>
</header>

<main class="reproductor" id="reproductor">
  <div class="cabecera">
    <div class="estado"><span class="punto"></span><span id="estado">En vivo</span></div>
    <div class="etiquetas">
      <span class="calidad" id="oyentes" title="Personas escuchando ahora" hidden></span>
      <span class="calidad" id="calidad" title="Calidad de audio de la transmisión">Calidad: MP3 96 kbps</span>
    </div>
  </div>

  <div class="tema">
    <div class="tapa">
      <img id="tapa" alt="">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v10.55A4 4 0 1 0 14 17V7h4V3h-6z"/></svg>
    </div>
    <div>
      <p class="titulo" id="titulo">Radio Pop en Español</p>
      <p class="artista" id="artista">Tocá play para escuchar</p>
    </div>
  </div>

  <div class="progreso" id="progreso" hidden>
    <div class="barra incierta" id="barra" role="progressbar" aria-label="Avance de la canción"
         aria-valuemin="0" aria-valuemax="100"><span class="relleno" id="relleno"></span></div>
    <div class="tiempos"><span id="t-actual">--:--</span><span id="t-total">--:--</span></div>
  </div>

  <div class="controles">
    <button class="play" id="play" aria-label="Escuchar">
      <svg id="icono" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5v14l11-7z"/></svg>
    </button>
    <div class="volumen">
      <button class="silencio" id="silencio" aria-label="Silenciar">
        <svg id="icono-vol" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3A4.5 4.5 0 0 0 14 8v8a4.5 4.5 0 0 0 2.5-4z"/></svg>
      </button>
      <input type="range" id="volumen" min="0" max="1" step="0.01" value="0.8" aria-label="Volumen">
    </div>
  </div>

  <p class="aviso" id="aviso" role="status"></p>
</main>

<section class="historial" aria-labelledby="titulo-historial">
  <h2 id="titulo-historial">Sonó recién</h2>
  <ol id="lista"><li class="vacio">Todavía no hay datos.</li></ol>
</section>

<footer>
  <p>La música es de artistas independientes, bajo licencias Creative Commons. Cada tema pertenece a su artista.</p>
</footer>

<audio id="audio" preload="none"></audio>

<script>
  // ====== DATOS DE TU RADIO ======
  const RADIO = "https://radio-render-ey3i.onrender.com";   // tu radio en Render
  const STREAM = RADIO + "/stream";
  const AHORA = RADIO + "/ahora";                           // tema actual e historial
  const CALIDAD = "MP3 96 kbps";   // cambialo acá si cambiás el formato en radio.liq
  const RETRASO = 0;    // segundos que el oyente escucha atrasado (0 = en vivo)
  const JAMENDO_ID = "9e34a0cf";   // para saber cuánto dura cada canción

  const NOMBRE = "Radio Pop en Español";   // nombre que se ve en la pestaña y en el celular bloqueado
  const audio = document.getElementById("audio");
  const boton = document.getElementById("play");
  const icono = document.getElementById("icono");
  const aviso = document.getElementById("aviso");
  const caja = document.getElementById("reproductor");
  const PLAY = '<path d="M8 5v14l11-7z"/>';
  const PAUSA = '<path d="M6 5h4v14H6zM14 5h4v14h-4z"/>';
  const VOL = '<path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3A4.5 4.5 0 0 0 14 8v8a4.5 4.5 0 0 0 2.5-4z"/>';
  const MUDO = '<path d="M3 9v6h4l5 5V4L7 9H3zm13.6 3 2.7-2.7-1.4-1.4-2.7 2.7-2.7-2.7-1.4 1.4 2.7 2.7-2.7 2.7 1.4 1.4 2.7-2.7 2.7 2.7 1.4-1.4z"/>';
  let quiereEscuchar = false;   // el oyente tocó play (aunque se corte, se reintenta)
  let reintentos = 0, temporizador = null;

  // 5. volumen y silencio (en iPhone solo silencio)
  if (/iPad|iPhone|iPod/.test(navigator.userAgent)) document.body.classList.add("es-ios");
  audio.volume = 0.8;
  document.getElementById("volumen").addEventListener("input", e => {
    audio.volume = e.target.value; audio.muted = false; iconoVolumen();
  });
  document.getElementById("silencio").addEventListener("click", () => {
    audio.muted = !audio.muted; iconoVolumen();
  });
  function iconoVolumen() {
    document.getElementById("icono-vol").innerHTML = audio.muted ? MUDO : VOL;
    document.getElementById("silencio").setAttribute("aria-label", audio.muted ? "Activar sonido" : "Silenciar");
  }

  function decir(texto, esError) {
    aviso.textContent = texto || "";
    aviso.classList.toggle("error", !!esError);
  }

  // 8. botón con estados: detenido, cargando, sonando
  function ponerBoton(modo) {
    boton.classList.toggle("cargando", modo === "cargando");
    boton.setAttribute("aria-busy", modo === "cargando");
    icono.innerHTML = modo === "sonando" ? PAUSA : PLAY;
    boton.setAttribute("aria-label", modo === "detenido" ? "Escuchar" : "Pausar");
    caja.classList.toggle("sonando", modo === "sonando");
    if ("mediaSession" in navigator) {
      navigator.mediaSession.playbackState = modo === "detenido" ? "paused" : "playing";
    }
    actualizarPestana();
  }

  function conectar() {
    clearTimeout(temporizador);
    ponerBoton("cargando");
    audio.src = STREAM + "?t=" + Date.now();   // siempre en vivo
    audio.play().then(() => {
      reintentos = 0; decir(""); ponerBoton("sonando");
    }).catch(err => {
      if (err && err.name === "NotAllowedError") {   // el navegador pide un toque del usuario
        quiereEscuchar = false; ponerBoton("detenido");
        decir("Tocá play para escuchar.");
      } else {
        reintentar();
      }
    });
  }

  function detener() {
    quiereEscuchar = false;
    clearTimeout(temporizador);
    audio.pause();
    audio.removeAttribute("src");
    audio.load();
    decir("");
    ponerBoton("detenido");
  }

  // 7. reconexión automática: espera 2, 4, 8… hasta 30 segundos entre intentos
  function reintentar() {
    if (!quiereEscuchar) return;
    reintentos++;
    const espera = Math.min(30, 2 ** reintentos);
    ponerBoton("cargando");
    decir(reintentos > 3
      ? "La radio no responde. Sigo intentando cada " + espera + " s…"
      : "Reconectando…", reintentos > 3);
    clearTimeout(temporizador);
    temporizador = setTimeout(conectar, espera * 1000);
  }

  boton.addEventListener("click", () => {
    if (quiereEscuchar) detener();
    else { quiereEscuchar = true; reintentos = 0; decir("Conectando…"); conectar(); }
  });
  audio.addEventListener("error", () => { if (quiereEscuchar && audio.getAttribute("src")) reintentar(); });
  audio.addEventListener("ended", () => { if (quiereEscuchar) reintentar(); });
  audio.addEventListener("stalled", () => {
    if (!quiereEscuchar) return;
    clearTimeout(temporizador);
    temporizador = setTimeout(() => { if (audio.paused || audio.readyState < 3) reintentar(); }, 8000);
  });
  audio.addEventListener("waiting", () => { if (quiereEscuchar) ponerBoton("cargando"); });
  audio.addEventListener("playing", () => { reintentos = 0; decir(""); ponerBoton("sonando"); });

  // 6. controles en el celular bloqueado y en auriculares
  if ("mediaSession" in navigator) {
    navigator.mediaSession.setActionHandler("play", () => { if (!quiereEscuchar) boton.click(); });
    navigator.mediaSession.setActionHandler("pause", () => { if (quiereEscuchar) detener(); });
    navigator.mediaSession.setActionHandler("stop", () => detener());
  }
  function datosBloqueo(titulo, artista, tapa) {
    if (!("mediaSession" in navigator) || !window.MediaMetadata) return;
    navigator.mediaSession.metadata = new MediaMetadata({
      title: titulo || NOMBRE, artist: artista || "", album: NOMBRE,
      artwork: tapa ? [{ src: tapa, sizes: "300x300" }] : []
    });
  }

  // 9. el tema actual en la pestaña
  let temaPestana = "";
  function actualizarPestana() {
    const sonandoYa = caja.classList.contains("sonando");
    document.title = temaPestana ? (sonandoYa ? "▶ " : "") + temaPestana + " | " + NOMBRE : NOMBRE;
  }

  // 2. la radio fuera del aire
  function ponerAire(enAire) {
    caja.classList.toggle("apagada", !enAire);
    document.getElementById("estado").textContent = enAire ? "En vivo" : "Fuera del aire";
  }

  document.getElementById("calidad").textContent = "Calidad: " + CALIDAD;

  // ====== QUÉ ESTÁ SONANDO (datos de Centova) ======
  const historial = [];
  let actual = "";
  let historialDelServidor = false;   // true cuando la radio entrega su propio historial
  function jsonp(url, alRecibir) {
    const nombre = "cb" + Date.now() + Math.floor(Math.random() * 1e6);
    const s = document.createElement("script");
    const limpiar = () => { delete window[nombre]; s.remove(); };
    window[nombre] = datos => { alRecibir(datos); limpiar(); };
    s.onerror = limpiar;
    s.src = url + (url.includes("?") ? "&" : "?") + "callback=" + nombre;
    document.body.appendChild(s);
  }
  // Pide a la radio el tema actual y el historial (una sola consulta para las dos cosas)
  function textoOyentes(n) { return "👥 " + n + (n === 1 ? " oyente" : " oyentes"); }

  function pedirInfo() {
    fetch(AHORA, { cache: "no-store" })
      .then(r => r.json())
      .then(j => {
        mostrar(j); usarHistorial({ data: [j.historial || []] });
        const o = document.getElementById("oyentes");
        o.hidden = typeof j.oyentes !== "number";
        if (!o.hidden) o.textContent = textoOyentes(j.oyentes);
      })
      .catch(() => {});
  }

  // ====== BARRA DE PROGRESO ======
  let inicio = null;      // cuándo empezó el tema (null = no se sabe)
  let duracion = null;    // segundos, según Jamendo
  let primera = true;     // el tema que ya sonaba al abrir la página

  function reloj(seg) {
    seg = Math.max(0, Math.floor(seg));
    return Math.floor(seg / 60) + ":" + String(seg % 60).padStart(2, "0");
  }

  function normal(txt) {
    return String(txt || "").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "")
      .replace(/[^a-z0-9]+/g, " ").trim();
  }

  function buscarDuracion(artista, titulo) {
    duracion = null;   // se completa enseguida con el dato de la radio (o de Jamendo)
    const quien = normal(artista), que = normal(titulo);
    const elegir = lista => {
      const mismos = lista.filter(t => normal(t.name) === que);
      return mismos.find(t => normal(t.artist_name) === quien) || mismos[0] ||
             lista.find(t => normal(t.artist_name) === quien) || null;
    };
    const pedir = (extra, siFalla) => {
      const q = new URLSearchParams(Object.assign({
        client_id: JAMENDO_ID, format: "json", limit: "10", type: "single albumtrack"
      }, extra));
      jsonp("https://api.jamendo.com/v3.0/tracks/?" + q, datos => {
        const tema = elegir((datos && datos.results) || []);
        // la radio ya manda la duración; Jamendo queda solo como respaldo
        if (!duracion && tema && tema.duration) { duracion = Number(tema.duration); pintarBarra(); }
        // tapa del disco desde Jamendo, si la radio no mandó una
        const img = document.getElementById("tapa");
        if (tema && tema.image && img.style.display !== "block") {
          img.src = tema.image; img.style.display = "block";
          datosBloqueo(titulo, artista, tema.image);
        }
        else if (siFalla) siFalla();
      });
    };
    // 1º por título exacto; 2º búsqueda libre con artista y título
    pedir({ namesearch: titulo }, () => pedir({ search: artista + " " + titulo }));
  }

  function pintarBarra() {
    const barra = document.getElementById("barra");
    const relleno = document.getElementById("relleno");
    // sin tema conocido no hay nada que medir: la barra se oculta
    document.getElementById("progreso").hidden = !actual;
    document.getElementById("t-total").textContent = duracion ? reloj(duracion) : "--:--";
    if (inicio && duracion) {
      const pasado = (Date.now() - inicio) / 1000;
      const pct = Math.min(100, pasado / duracion * 100);
      barra.classList.remove("incierta");
      relleno.style.width = pct + "%";
      barra.setAttribute("aria-valuenow", Math.round(pct));
      document.getElementById("t-actual").textContent = reloj(Math.min(pasado, duracion));
    } else {
      barra.classList.add("incierta");
      relleno.style.width = "";
      barra.removeAttribute("aria-valuenow");
      // si se sabe cuándo empezó pero no cuánto dura, igual muestra el tiempo que va
      document.getElementById("t-actual").textContent =
        inicio ? reloj((Date.now() - inicio) / 1000) : "--:--";
    }
  }
  setInterval(pintarBarra, 1000);

  function mostrar(datos) {
    const d = datos && datos.data && datos.data[0];
    if (!d) return;
    const pista = d.track || {};
    let artista = pista.artist || "", titulo = pista.title || "";
    if (!titulo && d.song) {
      const partes = String(d.song).split(" - ");
      artista = partes.length > 1 ? partes.shift() : "";
      titulo = partes.join(" - ");
    }
    const caida = /offline|unavailable|fuera del aire/i.test(String(d.song || "") + " " + titulo)
               || (d.server !== undefined && d.server !== "Online");
    ponerAire(!caida);
    if (caida) { temaPestana = ""; actual = ""; actualizarPestana(); pintarBarra(); return; }
    if (!titulo) return;
    titulo = titulo.replace(/^\d+ - /, "");   // saca el número de Jamendo del nombre
    document.getElementById("titulo").textContent = titulo;
    document.getElementById("artista").textContent = artista || NOMBRE;
    temaPestana = artista ? titulo + " – " + artista : titulo;
    actualizarPestana();

    const img = document.getElementById("tapa");
    const url = pista.imageurl;
    const tapaOk = url && !/nocover/i.test(url);
    if (tapaOk) { img.src = url; img.style.display = "block"; }
    else { img.style.display = "none"; }
    datosBloqueo(titulo, artista, tapaOk ? url : "");

    const clave = artista + "|" + titulo;
    actual = clave;
    if (historial[0] !== clave) {
      inicio = primera ? null : Date.now();   // se corrige con la hora exacta del historial
      primera = false;
      buscarDuracion(artista, titulo);
      setTimeout(pedirHistorial, 1500);
      historial.unshift(clave);
      historial.length = Math.min(historial.length, 6);
      if (historialDelServidor) { pedirHistorial(); return; }
      const lista = document.getElementById("lista");
      lista.innerHTML = "";
      historial.slice(1).forEach(item => {
        const [a, t] = item.split("|");
        const li = document.createElement("li");
        li.innerHTML = "<b></b><small></small>";
        li.querySelector("b").textContent = t;
        li.querySelector("small").textContent = a;
        lista.appendChild(li);
      });
      if (!lista.children.length) lista.innerHTML = '<li class="vacio">Todavía no hay datos.</li>';
    }
    tiemposDelServidor(pista);
  }

  // La radio manda cuánto dura el tema y a qué hora empezó: la barra queda exacta
  function tiemposDelServidor(pista) {
    if (Number(pista.duration) > 0) duracion = Number(pista.duration);
    if (Number(pista.start) > 0) inicio = Number(pista.start) * 1000 + RETRASO * 1000;
    pintarBarra();
  }

  // ====== HISTORIAL DE LA RADIO (el mismo para todos) ======
  function separar(item) {
    if (!item || typeof item !== "object") return null;
    let artista = item.artist || (item.track && item.track.artist) || "";
    let titulo = item.title || (item.track && item.track.title) || "";
    if (!titulo && (item.song || item.name)) {
      const partes = String(item.song || item.name).split(" - ");
      artista = artista || (partes.length > 1 ? partes.shift() : "");
      titulo = partes.join(" - ");
    }
    titulo = String(titulo).replace(/^\d+ - /, "");
    const hora = Number(item.time) || 0;   // segundos desde 1970: cuándo empezó a sonar
    // descarta registros vacíos o de "desconocido" (por ejemplo, al reiniciar el servidor)
    const vacio = t => !t || /^(unknown|desconocido|n\/a|-+)$/i.test(String(t).trim());
    if (vacio(titulo)) return null;
    if (vacio(artista)) artista = "";
    return { artista, titulo, hora };
  }

  function buscarLista(x) {
    // Centova anida la lista de distintas formas: busca el primer arreglo de temas
    if (Array.isArray(x)) {
      if (x.some(i => separar(i))) return x;
      for (const i of x) { const r = buscarLista(i); if (r) return r; }
    } else if (x && typeof x === "object") {
      for (const k of Object.keys(x)) { const r = buscarLista(x[k]); if (r) return r; }
    }
    return null;
  }

  function haceCuanto(hora) {
    if (!hora) return "";
    const min = Math.round((Date.now() / 1000 - hora) / 60);
    return min < 1 ? "recién" : min < 60 ? "hace " + min + " min" : "hace " + Math.round(min / 60) + " h";
  }

  function usarHistorial(datos) {
    const temas = (buscarLista(datos && datos.data) || []).map(separar).filter(Boolean);
    if (!temas.length) return false;
    historialDelServidor = true;

    // el primero es el que suena ahora: su hora de inicio hace exacta la barra
    const ahora = temas[0];
    if (ahora.hora && normal(ahora.artista + " " + ahora.titulo) === normal(actual.replace("|", " "))) {
      inicio = ahora.hora * 1000;
    }

    const lista = document.getElementById("lista");
    lista.innerHTML = "";
    temas.slice(1, 6).forEach(t => {
      const li = document.createElement("li");
      li.innerHTML = "<b></b><small></small>";
      li.querySelector("b").textContent = t.titulo;
      li.querySelector("small").textContent = [t.artista, haceCuanto(t.hora)].filter(Boolean).join(" · ");
      lista.appendChild(li);
    });
    if (!lista.children.length) lista.innerHTML = '<li class="vacio">Todavía no hay datos.</li>';
    return true;
  }

  function pedirHistorial() { pedirInfo(); }

  pedirInfo();
  setInterval(pedirInfo, 5000);
</script>
