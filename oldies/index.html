<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Radio Oldies</title>
<meta name="description" content="Los éxitos de los 70 y 80 en vivo">
<meta name="theme-color" content="#ffffff">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Audiowide&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<style>
  /* ====== CAMBIÁ ACÁ LOS COLORES ====== */
  :root {
    --fondo: #ffffff;
    --tarjeta: #ffffff;
    --texto: #1a1033;
    --suave: #5f5680;
    --acento: #e8590c;
    --acento-2: #0891b2;
    --borde: #ece6f6;
    --error: #b42318;
  }
  * { box-sizing: border-box; margin: 0; }
  body {
    min-height: 100vh;
    background:
      linear-gradient(transparent 0 calc(100% - 1px), #e8590c12 0) 0 0 / 100% 2.5rem,
      linear-gradient(90deg, transparent 0 calc(100% - 1px), #0891b210 0) 0 0 / 2.5rem 100%,
      radial-gradient(55rem 30rem at 50% -5%, #e8590c1a, transparent 65%),
      #ffffff;
    color: var(--texto);
    font-family: "Inter", system-ui, sans-serif;
    display: flex; flex-direction: column; align-items: center;
    padding: 2rem 1rem 3rem;
  }
  header { width: 100%; max-width: 30rem; margin-bottom: 1.5rem; }
  .marca {
    font-family: "Audiowide", sans-serif; font-weight: 400;
    font-size: clamp(2rem, 9vw, 3rem); line-height: 1.05; letter-spacing: -.02em;
    text-shadow: 0 .15rem 0 #e8590c26;
  }
  .marca span { color: var(--acento-2); }
  .lema { color: var(--suave); margin-top: .5rem; }

  .reproductor {
    width: 100%; max-width: 30rem;
    background: var(--tarjeta); border: 1px solid var(--borde);
    border-radius: 1.5rem; padding: 1.5rem;
    box-shadow: 0 1.25rem 2.5rem #1a103314;
  }
  .estado {
    display: inline-flex; align-items: center; gap: .45rem;
    font-size: .8rem; font-weight: 500; letter-spacing: .08em; text-transform: uppercase;
    color: var(--suave);
  }
  .punto { width: .55rem; height: .55rem; border-radius: 50%; background: var(--suave); }
  .sonando .punto { background: var(--acento); animation: latido 1.4s ease-in-out infinite; }
  .sonando .estado { color: var(--acento); }
  @keyframes latido { 50% { opacity: .3; transform: scale(.8); } }

  .emisora { display: flex; gap: 1rem; align-items: center; margin: 1.25rem 0 1.5rem; }
  .logo {
    width: 5.5rem; height: 5.5rem; flex: none; border-radius: 1rem; overflow: hidden;
    background: linear-gradient(135deg, var(--acento), var(--acento-2));
    display: grid; place-items: center;
  }
  .logo img { width: 100%; height: 100%; object-fit: cover; display: none; background: #fff; }
  .logo:has(img[style*="block"]) { border: 1px solid var(--borde); }
  .logo svg { width: 2.4rem; height: 2.4rem; fill: #ffffffd9; }
  .nombre { font-family: "Audiowide", sans-serif; font-size: 1.2rem; line-height: 1.25; overflow-wrap: anywhere; }
  .detalle { color: var(--suave); margin-top: .3rem; font-size: .9rem; }

  .controles { display: flex; align-items: center; gap: 1rem; }
  .play {
    width: 4.25rem; height: 4.25rem; flex: none; border: 0; border-radius: 50%;
    background: var(--acento); color: #fff; cursor: pointer;
    display: grid; place-items: center;
    transition: transform .15s ease;
    box-shadow: 0 .6rem 1.5rem #e8590c4d;
  }
  .play:hover { transform: scale(1.05); }
  .play:active { transform: scale(.96); }
  .play:disabled { opacity: .5; cursor: default; transform: none; }
  .play:focus-visible { outline: 3px solid var(--acento-2); outline-offset: 3px; }
  .play svg { width: 1.7rem; height: 1.7rem; fill: currentColor; }
  .play.cargando svg { display: none; }
  .play.cargando::after {
    content: ""; width: 1.6rem; height: 1.6rem; border-radius: 50%;
    border: 3px solid #ffffff59; border-top-color: #fff; animation: girar .8s linear infinite;
  }
  @keyframes girar { to { transform: rotate(360deg); } }

  .volumen { margin-left: auto; display: flex; align-items: center; gap: .4rem; color: var(--suave); }
  .silencio {
    width: 2.4rem; height: 2.4rem; border: 0; border-radius: 50%; background: transparent;
    color: var(--suave); cursor: pointer; display: grid; place-items: center;
  }
  .silencio:hover { background: var(--borde); }
  .silencio:focus-visible { outline: 2px solid var(--acento-2); }
  .silencio svg { width: 1.3rem; height: 1.3rem; fill: currentColor; }
  input[type=range] { width: 7rem; accent-color: var(--acento); }
  .es-ios input[type=range] { display: none; }

  .aviso { min-height: 1.2rem; margin-top: 1rem; font-size: .85rem; color: var(--suave); }
  .aviso.error { color: var(--error); }
  .aviso.error::before { content: "⚠ "; }

  footer {
    width: 100%; max-width: 30rem; margin-top: 2.5rem;
    font-size: .8rem; line-height: 1.5; color: var(--suave);
  }
  footer a { color: var(--texto); }
  @media (prefers-reduced-motion: reduce) {
    .play.cargando::after, .sonando .punto { animation-duration: 3s; }
  }
</style>
</head>
<body>

<header>
  <h1 class="marca">Radio<br><span>Oldies</span></h1>
  <p class="lema">Los éxitos de los 70 y 80 en vivo</p>
</header>

<main class="reproductor" id="reproductor">
  <div class="estado"><span class="punto"></span><span id="estado">Buscando radio…</span></div>

  <div class="emisora">
    <div class="logo">
      <img id="logo" alt="">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v10.55A4 4 0 1 0 14 17V7h4V3h-6z"/></svg>
    </div>
    <div>
      <p class="nombre" id="nombre">Radio Oldies</p>
      <p class="detalle" id="detalle">Buscando la radio de ABBA…</p>
    </div>
  </div>

  <div class="controles">
    <button class="play" id="play" aria-label="Escuchar" disabled>
      <svg id="icono" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5v14l11-7z"/></svg>
    </button>
    <div class="volumen">
      <button class="silencio" id="silencio" aria-label="Silenciar">
        <svg id="icono-vol" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3A4.5 4.5 0 0 0 14 8v8a4.5 4.5 0 0 0 2.5-4z"/></svg>
      </button>
      <input type="range" id="volumen" min="0" max="1" step="0.01" value="0.8" aria-label="Volumen">
    </div>
  </div>

  <p class="aviso" id="aviso" role="status"></p>
</main>

<footer>
  <p>La radio que suena es la de éxitos de los 70 y 80 más votada en
    <a href="https://www.radio-browser.info" target="_blank" rel="noopener">Radio Browser</a>,
    un directorio abierto de radios por internet. La música y la transmisión pertenecen a esa emisora.
    <span id="web"></span></p>
</footer>

<audio id="audio" preload="none"></audio>

<script>
  // ====== CONFIGURACIÓN ======
  const ETIQUETA = "oldies";       // género de respaldo en Radio Browser
  const NOMBRE = "Radio Oldies";      // nombre de la pestaña y del celular bloqueado
  const SERVIDORES = [             // servidores del directorio (si uno falla, prueba el siguiente)
    "https://de1.api.radio-browser.info",
    "https://fi1.api.radio-browser.info",
    "https://nl1.api.radio-browser.info",
    "https://de2.api.radio-browser.info"
  ];

  const audio = document.getElementById("audio");
  const boton = document.getElementById("play");
  const icono = document.getElementById("icono");
  const aviso = document.getElementById("aviso");
  const caja = document.getElementById("reproductor");
  const PLAY = '<path d="M8 5v14l11-7z"/>';
  const PAUSA = '<path d="M6 5h4v14H6zM14 5h4v14h-4z"/>';
  const VOL = '<path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3A4.5 4.5 0 0 0 14 8v8a4.5 4.5 0 0 0 2.5-4z"/>';
  const MUDO = '<path d="M3 9v6h4l5 5V4L7 9H3zm13.6 3 2.7-2.7-1.4-1.4-2.7 2.7-2.7-2.7-1.4 1.4 2.7 2.7-2.7 2.7 1.4 1.4 2.7-2.7 2.7 2.7 1.4-1.4z"/>';

  let radio = null;              // la emisora elegida
  let servidor = SERVIDORES[0];
  let quiereEscuchar = false, reintentos = 0, temporizador = null;

  function decir(texto, esError) {
    aviso.textContent = texto || "";
    aviso.classList.toggle("error", !!esError);
  }

  // ====== BUSCAR LA RADIO MÁS VOTADA ======
  // Busca, en este orden, la radio más votada que pase éxitos de los 70 y 80:
  // 1) etiquetas "70s" y "80s" juntas, 2) "oldies" + "80s", 3) "oldies" + "70s", 4) cualquier "oldies".
  // Primero: la radio de ABBA más votada. Si no aparece, las de éxitos de los 70 y 80.
  const RADIO_PREFERIDA = "abba";
  const BUSQUEDAS = [
    { name: "ABBA" },
    { tagList: "70s,80s" },
    { tagList: "oldies,80s" },
    { tagList: "oldies,70s" },
    { tag: ETIQUETA, tagExact: "true" }
  ];
  // descarta radios centradas en décadas posteriores (90, 2000…)
  const DECADAS_NUEVAS = /(^|[^0-9])(19)?90'?s|(^|[^0-9])(20)?(00|10|20)'?s|2000s|2010s/i;
  const normal = t => String(t || "").toLowerCase().replace(/[^a-z0-9]+/g, " ").trim();
  const sirve = (e, filtro) => (e.url_resolved || "").startsWith("https://") &&
    (filtro.name ? normal(e.name).split(" ").includes(RADIO_PREFERIDA)   // "ABBA" como palabra
                 : !DECADAS_NUEVAS.test(e.tags || ""));

  async function buscarRadio() {
    for (const filtro of BUSQUEDAS) {
      const q = new URLSearchParams(Object.assign({
        order: "votes", reverse: "true", hidebroken: "true", is_https: "true", limit: "60"
      }, filtro));
      for (const s of SERVIDORES) {
        try {
          const r = await fetch(s + "/json/stations/search?" + q);
          if (!r.ok) continue;
          const elegida = (await r.json()).find(e => sirve(e, filtro));
          if (elegida) { servidor = s; return elegida; }
          break;   // respondió pero sin resultados útiles: pasa a la búsqueda siguiente
        } catch (e) { /* servidor caído: prueba el siguiente */ }
      }
    }
    return null;
  }

  function mostrarRadio(e) {
    radio = e;
    document.getElementById("nombre").textContent = e.name.trim() || NOMBRE;
    const partes = [e.country, e.codec && e.bitrate ? e.codec + " " + e.bitrate + " kbps" : e.codec,
                    e.votes ? Number(e.votes).toLocaleString("es") + " votos" : ""];
    document.getElementById("detalle").textContent = partes.filter(Boolean).join(" · ");
    const logo = document.getElementById("logo");
    if (e.favicon && e.favicon.startsWith("https://")) {
      logo.onload = () => { logo.style.display = "block"; };
      logo.onerror = () => { logo.style.display = "none"; };
      logo.src = e.favicon;
    }
    if (e.homepage) {
      const a = document.createElement("a");
      a.href = e.homepage; a.target = "_blank"; a.rel = "noopener";
      a.textContent = "Sitio de la emisora";
      document.getElementById("web").append(" ", a, ".");
    }
    document.getElementById("estado").textContent = "En vivo";
    boton.disabled = false;
    document.title = e.name.trim() + " | " + NOMBRE;
    if ("mediaSession" in navigator && window.MediaMetadata) {
      navigator.mediaSession.metadata = new MediaMetadata({
        title: e.name.trim(), artist: "Éxitos de los 70 y 80", album: NOMBRE,
        artwork: e.favicon && e.favicon.startsWith("https://") ? [{ src: e.favicon }] : []
      });
    }
  }

  // ====== REPRODUCTOR ======
  function ponerBoton(modo) {
    boton.classList.toggle("cargando", modo === "cargando");
    boton.setAttribute("aria-busy", modo === "cargando");
    icono.innerHTML = modo === "sonando" ? PAUSA : PLAY;
    boton.setAttribute("aria-label", modo === "detenido" ? "Escuchar" : "Pausar");
    caja.classList.toggle("sonando", modo === "sonando");
    if ("mediaSession" in navigator) {
      navigator.mediaSession.playbackState = modo === "detenido" ? "paused" : "playing";
    }
    if (radio) document.title = (modo === "sonando" ? "▶ " : "") + radio.name.trim() + " | " + NOMBRE;
  }

  function conectar() {
    clearTimeout(temporizador);
    ponerBoton("cargando");
    audio.src = radio.url_resolved;
    audio.play().then(() => {
      reintentos = 0; decir(""); ponerBoton("sonando");
    }).catch(err => {
      if (err && err.name === "NotAllowedError") {
        quiereEscuchar = false; ponerBoton("detenido"); decir("Tocá play para escuchar.");
      } else reintentar();
    });
  }

  function detener() {
    quiereEscuchar = false;
    clearTimeout(temporizador);
    audio.pause();
    audio.removeAttribute("src");
    audio.load();
    decir("");
    ponerBoton("detenido");
  }

  function reintentar() {
    if (!quiereEscuchar) return;
    reintentos++;
    const espera = Math.min(30, 2 ** reintentos);
    ponerBoton("cargando");
    decir(reintentos > 3 ? "La radio no responde. Sigo intentando cada " + espera + " s…"
                         : "Reconectando…", reintentos > 3);
    clearTimeout(temporizador);
    temporizador = setTimeout(conectar, espera * 1000);
  }

  boton.addEventListener("click", () => {
    if (!radio) return;
    if (quiereEscuchar) { detener(); return; }
    quiereEscuchar = true; reintentos = 0; decir("Conectando…"); conectar();
    // cuenta la escucha en el directorio, como pide Radio Browser
    fetch(servidor + "/json/url/" + radio.stationuuid).catch(() => {});
  });
  audio.addEventListener("error", () => { if (quiereEscuchar && audio.getAttribute("src")) reintentar(); });
  audio.addEventListener("ended", () => { if (quiereEscuchar) reintentar(); });
  audio.addEventListener("waiting", () => { if (quiereEscuchar) ponerBoton("cargando"); });
  audio.addEventListener("playing", () => { reintentos = 0; decir(""); ponerBoton("sonando"); });

  if ("mediaSession" in navigator) {
    navigator.mediaSession.setActionHandler("play", () => { if (!quiereEscuchar) boton.click(); });
    navigator.mediaSession.setActionHandler("pause", () => { if (quiereEscuchar) detener(); });
    navigator.mediaSession.setActionHandler("stop", () => detener());
  }

  // volumen y silencio (en iPhone solo silencio)
  if (/iPad|iPhone|iPod/.test(navigator.userAgent)) document.body.classList.add("es-ios");
  audio.volume = 0.8;
  document.getElementById("volumen").addEventListener("input", e => {
    audio.volume = e.target.value; audio.muted = false; iconoVolumen();
  });
  document.getElementById("silencio").addEventListener("click", () => { audio.muted = !audio.muted; iconoVolumen(); });
  function iconoVolumen() {
    document.getElementById("icono-vol").innerHTML = audio.muted ? MUDO : VOL;
    document.getElementById("silencio").setAttribute("aria-label", audio.muted ? "Activar sonido" : "Silenciar");
  }

  // ====== INICIO ======
  buscarRadio().then(e => {
    if (e) mostrarRadio(e);
    else {
      document.getElementById("estado").textContent = "Sin conexión";
      document.getElementById("detalle").textContent = "No se pudo consultar el directorio de radios.";
      decir("Probá recargar la página en un momento.", true);
    }
  });
</script>
</body>
</html>
